            // Avoid division by zero if they are perfectly overlapping

            // Calculate pull strength (closer = stronger)
            let pull = (200 - mbDist) * 0.0006;


            // 3. Find the angle and apply the force
            let angle = Math.atan2(dy, dx);
            b.xVel += Math.cos(angle) * pull;
            b.yVel += Math.sin(angle) * pull;
        }

        function makeRope(x1, y1, x2, y2, gap) {
    const dist = getDistance(x1, y1, x2, y2);
    if (dist < gap) return
    // Determine how many balls fit in this distance
    const steps = Math.floor(dist / gap);
   
    // Calculate the normalized step for x and y
    const dx = (x2 - x1) / steps;
    const dy = (y2 - y1) / steps;

*/

        const currentIdx = balls.length - 1;

function makeBlock(startX, startY, widthCount, heightCount, spacing) {
    let w = Math.abs(Math.round(widthCount));
    let h = Math.abs(Math.round(heightCount));
    
    let absSpacing = Math.abs(spacing);

    for (let row = 0; row <= h; row++) {
        for (let col = 0; col <= w; col++) {
            let px = startX + col * spacing;
            let py = startY + row * spacing;

            let mySprings = isNearBall(px, py, absSpacing * 1.5) || [];
            let myDists = isNearBall(px, py, absSpacing * 1.5, true) || [];
            
            makeBall(px, py, ballRadias, mySprings, myDists);
        }
    }
}











        function getDistance(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }
















        function dot(x1, y1, x2, y2) {
            return (x1 * x2) + (y1 * y2)
        }
        function getNormal(x1, y1, x2, y2) {
            const distX = x2 - x1;
            const distY = y2 - y1;
            const len = Math.hypot(distX, distY)
           
            return {
                x: distY / len,
                y:-distX / len
            };
        }
        function isNearBall(x, y, dist, dists = false, min = false) {
    let output = [];
    let closest = 10000;
    let closestOutput = null;
    for (let i = 0; i < balls.length; i++) {
        let b = balls[i];
        let d = getDistance(x, y, b.x, b.y);
        if (d < closest) {
            closest = d;
            closestOutput = i;
        }
        if (d < dist && d > 0.1) {
            if (dists) output.push(d);
            else output.push(i);
        }
    }
    return min ? closestOutput : output;
}
        function bounce(b, line) {
            b.angleVel = b.angleVel ?? -0.1
            //const normalX = line[4][0]
            //const normalY = line[4][1]
            const normal = getNormal(line.x1, line.y1, line.x2, line.y2)
            if (getDistanceFromLine(b, line) > 0) {
                normal.x *= -1
                normal.y *= -1
            }
            const speedOnTangent = dot(b.xVel, b.yVel, normal.y, -normal.x)
            const speedOnNormal = dot(b.xVel, b.yVel, normal.x, normal.y)
            b.xVel = -(speedOnNormal  * normal.x + b.angleVel) * (restitution)
                    + (speedOnTangent * normal.y) * (1 - friction);
            b.yVel = -(speedOnNormal  * normal.y) * (restitution)
                    + (speedOnTangent *-normal.x + -b.angleVel) * (1 - friction);
           
            b.angleVel = (b.angleVel + speedOnTangent * 0.1) * (1 - friction);
            b.x += b.xVel
            b.y += b.yVel
            while (touchingLine(b, line)) {
                b.x += normal.x
                b.y += normal.y
            }
        }

        function collideWithBall(ball1, ball2) {
        let rest =  (elements[ball1.el].restitution +                                  elements[ball2.el].restitution) / 2
        //let bounce = 1
        if (!ballsTouch) return;
    if (ball1.xVel === "anchor" && ball2.xVel === "anchor") return;
    const dx = ball1.x - ball2.x;
    const dy = ball1.y - ball2.y;
    const distance = Math.hypot(dx, dy);
    const minDistance = ball1.radias + ball2.radias;
















    if (distance < minDistance && distance > 0) {
        const overlap = minDistance - distance;
        const nx = dx / distance;
        const ny = dy / distance;
        if (ball1.xVel !== "anchor") {
            ball1.x += nx * overlap * 0.5;
            ball1.y += ny * overlap * 0.5;
        }
        if (ball2.xVel !== "anchor") {
            ball2.x -= nx * overlap * 0.5;
            ball2.y -= ny * overlap * 0.5;
        }
















        const v1x = ball1.xVel === "anchor" ? 0 : ball1.xVel;
        const v1y = ball1.yVel === "anchor" ? 0 : ball1.yVel;
        const v2x = ball2.xVel === "anchor" ? 0 : ball2.xVel;
        const v2y = ball2.yVel === "anchor" ? 0 : ball2.yVel;
















        const relVelX = v1x - v2x;
        const relVelY = v1y - v2y;
        const velAlongNormal = (relVelX * nx) + (relVelY * ny);
        if (velAlongNormal > 0) return;
        const impulse = -(1 + rest) * velAlongNormal / 2;
       
        if (ball1.xVel !== "anchor") {
            ball1.xVel += impulse * nx;
            ball1.yVel += impulse * ny;
        }
        if (ball2.xVel !== "anchor") {
            ball2.xVel -= impulse * nx;
            ball2.yVel -= impulse * ny;
        }
    }
}


        function spring(b1, b2, dist, stiffness = false, springIndex) {


if (elements[b1.el].sType === 2) {

    return
}










    const distOfPoints = getDistance(b1.x, b1.y, b2.x, b2.y);

            }

            }
        }
    }






    if (!stiffness) {

            elements[b2.el].stiffness) / 2


}


   
   
    ctx.strokeStyle = isHydrolic ? "blue" : getSpringColor(b1.color, b2.color, 0.5);
    if (isHydrolic) {
        stiffness /= 2
        const xOfBig = b1.x - (dx / distOfPoints) * dist / 2;
        const yOfBig = b1.y - (dy / distOfPoints) * dist / 2;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(b1.x, b1.y);
        ctx.lineTo(xOfBig, yOfBig);
        ctx.stroke();
        dist *= hydrolicSize;
    }
















    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b1.x, b1.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.stroke();
















    if (!running || !b1 || !b2 || distOfPoints === 0) return;
















    let multiplyer = (1 - (dist / distOfPoints)) / 2 * stiffness;
   
    if (!b1.anchor) {
        b1.x += -dx * multiplyer;
        b1.y += -dy * multiplyer;
        b1.xVel += (-dx * multiplyer) / 1;
        b1.yVel += (-dy * multiplyer) / 1;
       
    }
    if (!b2.anchor) {
        b2.x += dx * multiplyer;
        b2.y += dy * multiplyer;
        b2.xVel += dx * multiplyer / 1;
        b2.yVel += dy * multiplyer / 1;
    }
}




















function spring2(b1, b2, dist, stiffness, damping = false) {
   
    const isHydrolic = hydrolics.some(pair => (pair[0] === b1 && pair[1] === b2) || (pair[0] === b2 && pair[1] === b1));
   
    ctx.strokeStyle = isHydrolic ? "blue" : getSpringColor(b1.color, b2.color, 0.5);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b1.x, b1.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.stroke();


    if (!running) return
   
    if (!damping) {
        damping = (elements[b1.el].damping +
                      elements[b2.el].damping) / 2
    }
   
    let springIndex = b1.spring.indexOf(balls.indexOf(b2))
   
   
   


    let dx = b2.x - b1.x;
    let dy = b2.y - b1.y;
   
   
    let len = Math.sqrt(dx * dx + dy * dy);
   
   
   
   
    let ballSnapAt = (elements[b1.el].snapAt +
                      elements[b2.el].snapAt) / 2
   
   
   
   
  if (len > dist * ballSnapAt || len < dist * (1 / ballSnapAt)) {
        if (!isHydrolic) {
            if (isSnap) {
                b1.spring.splice(springIndex, 1);
                b1.springDist.splice(springIndex, 1);
                
                 					if (elements[b1.el].spawnFire) {
                makeBall(
            b1.x,
            b1.y,
            4,
            [], [],
            getElementByName("fire"),
            )
            }
                return;
                
            }
        }
  }
   
   
   
   
    if (len === 0) return
    const force = stiffness * (len - dist);
   
   
    const fx = force * (dx / len);
    const fy = force * (dy / len);
   
   
    const rxvel = b2.xVel - b1.xVel;
    const ryvel = b2.yVel - b1.yVel;
   
   
    const totalFx = fx + (damping * rxvel);
    const totalFy = fy + (damping * ryvel);
   
   
   
     const m1 = b1.radius || 1;
    const m2 = b2.radius || 1;
   
   
    b1.xVel += (totalFx / m1);
    b1.yVel += (totalFy / m1);
   


    b2.xVel -= (totalFx / m2);
    b2.yVel -= (totalFy / m2);
 
    //TODO add mass to each ball  
    //b1.xVel += (totalFx / b2.radias) * dt;
    //b1.yVel += (totalFy / b2.radias) * dt;


   
 //   b2.xVel -= (totalFx / b2.radias) * dt;
  //  b2.yVel -= (totalFy / b2.radias) * dt;
   
   
}
























function getSpringColor(color1, color2, darkenFactor = 0.2) {
    const ctx = document.createElement('canvas').getContext('2d');
   
    ctx.fillStyle = color1;
    const c1Str = ctx.fillStyle;
    ctx.fillStyle = color2;
    const c2Str = ctx.fillStyle;
   
    const r1 = parseInt(c1Str.slice(1, 3), 16);
    const g1 = parseInt(c1Str.slice(3, 5), 16);
    const b1 = parseInt(c1Str.slice(5, 7), 16);
   
    const r2 = parseInt(c2Str.slice(1, 3), 16);
    const g2 = parseInt(c2Str.slice(3, 5), 16);
    const b2 = parseInt(c2Str.slice(5, 7), 16);
   
    const avgR = Math.round((r1 + r2) / 2);
    const avgG = Math.round((g1 + g2) / 2);
    const avgB = Math.round((b1 + b2) / 2);
   
    const darkR = Math.max(0, Math.round(avgR * (1 - darkenFactor)));
    const darkG = Math.max(0, Math.round(avgG * (1 - darkenFactor)));
    const darkB = Math.max(0, Math.round(avgB * (1 - darkenFactor)));
   
    return "#" + ((1 << 24) + (darkR << 16) + (darkG << 8) + darkB).toString(16).slice(1);
}
